name: Client Trial Repository Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s src/main.jsx
          test -s package.json
          test -s vite.config.js
          test -s _headers
          test ! -e vercel.json
          grep -q '"build": "vite build"' package.json
          grep -q 'noindex,nofollow,noarchive' index.html
