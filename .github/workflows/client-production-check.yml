name: Client production check

on:
  push:
    branches: [production-client-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --package-lock-only && npm ci
      - name: Build
        run: npm run build
      - name: Verify Cloudflare configuration
        run: test -f wrangler.jsonc && test -d dist
